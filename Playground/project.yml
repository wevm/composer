# The Playground: demos of every plugin, and the UI tests that need a running
# app. Generate the Xcode project with XcodeGen (`brew install xcodegen`):
# `xcodegen generate`, then open Playground.xcodeproj.
name: Playground
options:
  bundleIdPrefix: dev.wevm
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
packages:
  Composer:
    path: ..
targets:
  Playground:
    type: application
    supportedDestinations: [iOS, macOS]
    scheme:
      testTargets: [PlaygroundUITests]
    sources:
      - path: App
    dependencies:
      - package: Composer
        product: ComposerCore
      # The macOS demo's engine; its module is empty on iOS.
      - package: Composer
        product: ComposerAppKit
      - package: Composer
        product: ComposerSwiftUI
      - package: Composer
        product: ComposerStyled
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wevm.composer.playground
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Composer Playground
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  PlaygroundUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: Playground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wevm.composer.playground.uitests
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Playground
        CODE_SIGN_STYLE: Automatic
