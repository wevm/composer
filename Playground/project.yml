# The Playground: demos of every plugin, and the UI tests that need a running
# app. Generate the Xcode project with XcodeGen (`brew install xcodegen`):
# `xcodegen generate`, then open Playground.xcodeproj.
name: Playground
options:
  bundleIdPrefix: dev.wevm
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
packages:
  Composer:
    path: ..
targets:
  Playground:
    type: application
    supportedDestinations: [iOS, macOS]
    scheme:
      testTargets: [PlaygroundUITests]
    sources:
      - path: App
    dependencies:
      - package: Composer
        product: ComposerCore
      - package: Composer
        product: ComposerSwiftUI
      - package: Composer
        product: ComposerStyled
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wevm.composer.playground
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Composer Playground
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  PlaygroundUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: Playground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wevm.composer.playground.uitests
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Playground
        CODE_SIGN_STYLE: Automatic
  # The package's performance tests, hosted by the app so they run on a
  # device (package tests run only on the simulator and macOS):
  # `xcodebuild test -scheme PlaygroundPerformanceTests -configuration Release
  # -destination id=<device>`.
  PlaygroundPerformanceTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: ../Tests/PerformanceTests
    dependencies:
      - target: Playground
      - package: Composer
        product: ComposerCore
      - package: Composer
        product: ComposerUIKit
      - package: Composer
        product: ComposerTesting
    scheme:
      testTargets: [PlaygroundPerformanceTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wevm.composer.playground.performancetests
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Playground.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Playground
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
