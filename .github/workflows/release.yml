name: Release

# Tags a release when a push to main changes VERSION: the tag is VERSION's
# contents (0.0.x during the alpha), with a GitHub release whose notes list
# the pull requests since the last one. 0.0.0 means unreleased. Skipped when
# the release already exists, so a failed run can be rerun.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is '$version', not x.y.z." >&2
            exit 1
          fi
          if [ "$version" = 0.0.0 ]; then
            echo "0.0.0 is unreleased."
            exit 0
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is already released."
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
