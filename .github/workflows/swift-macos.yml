name: Swift (macOS)

# Every product on macOS and the iOS Simulator, and the Playground for both.
# Gates merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    name: Swift (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: swift --version
      - name: Build and test (macOS)
        run: swift test --skip PerformanceTests
      # New snapshot references, recorded where none exist, to review and
      # commit.
      - name: Upload recorded snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots-macos
          path: Tests/StyledSnapshotTests/__Snapshots__
          if-no-files-found: ignore
      # Alone, so other tests running in parallel don't skew the timings.
      - name: Performance budgets (macOS)
        run: swift test --skip-build --filter PerformanceTests

  ios:
    name: Swift (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test (iOS Simulator)
        run: |
          device="$(xcrun simctl list devices available -j |
            python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')"
          echo "device=$device" >> "$GITHUB_ENV"
          xcodebuild test -scheme Composer-Package -destination "id=$device" -skipPackagePluginValidation \
            -skip-testing:PerformanceTests
      # New snapshot references, recorded where none exist, to review and
      # commit.
      - name: Upload recorded snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots-ios
          path: Tests/StyledSnapshotTests/__Snapshots__
          if-no-files-found: ignore
      # Alone and serially, on the warmed-up simulator, so other tests don't
      # skew the timings.
      - name: Performance budgets (iOS Simulator)
        run: |
          xcodebuild test -scheme Composer-Package -destination "id=$device" -skipPackagePluginValidation \
            -only-testing:PerformanceTests -parallel-testing-enabled NO

  playground:
    name: Playground (iOS and macOS)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Playground
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      # build-for-testing also builds the UI tests.
      - name: Build the app (iOS Simulator)
        run: >-
          xcodebuild build-for-testing -project Playground.xcodeproj -scheme Playground
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Build the app (macOS)
        run: >-
          xcodebuild build-for-testing -project Playground.xcodeproj -scheme Playground
          -destination 'generic/platform=macOS'
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
